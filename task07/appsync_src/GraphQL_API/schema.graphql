type Meta {
    key1: Int
    key2: String
}

type PayLoad {
    meta: Meta
}

type Event {
    id: ID!
    userId: Int!
    createdAt: String!
    payLoad: PayLoad
}

type EventResult {
    id: ID!
    createdAt: String!
}

type Mutation {
    createEvent(userId: Int!, payLoad: AWSJSON!): EventResult
}

type Query {
    getEvent(id: ID!): Event
}

schema {
    query: Query
    mutation: Mutation
}